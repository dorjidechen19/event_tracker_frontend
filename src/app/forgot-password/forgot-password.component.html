<div class="min-h-screen flex items-center justify-center bg-gray-100 bg-gradient-to-b from-[#0f0c29] via-[#302b63] to-[#24243e]">
    <div class="bg-white shadow-md rounded-lg p-8 w-full max-w-md">
      <h2 class="text-3xl font-bold text-gray-700 text-center mb-6">Forgot Password</h2>
      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" novalidate>
        <div class="mb-4">
          <label for="email" class="block text-2xl font-medium text-gray-700">Email</label>
          <input 
            id="email" 
            formControlName="email" 
            type="email" 
            class="w-full h-12 bg-gray-100 text-gray-900 rounded-md px-4 focus:outline-none focus:ring-2 focus:ring-purple-500"
            placeholder="Enter your email">
          <div *ngIf="submitted && f['email'].errors" class="text-sm text-red-500 mt-1">
            <small *ngIf="f['email'].errors['required']">Email is required</small>
            <small *ngIf="f['email'].errors['email']">Invalid email format</small>
          </div>
        </div>
  
        <button 
          type="submit" 
          class="w-full bg-purple-600 text-white py-2 rounded-md hover:bg-purple-900 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2">
          Send Reset Link
        </button>
      </form>
  
      <div class="text-center mt-4">
        <a routerLink="/login" class="text-sm text-blue-600 hover:underline">Back to Login</a>
      </div>
    </div>
  </div>
